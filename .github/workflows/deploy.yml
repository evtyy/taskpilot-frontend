name: Deploy Frontend

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 532132111095.dkr.ecr.us-east-2.amazonaws.com
  IMAGE_NAME: taskpilot-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (linux/amd64, matches EC2's architecture)
        # VITE_API_URL is baked in at BUILD time — this must be the address
        # the BROWSER will use (EC2's public IP), not an internal hostname.
        run: |
          docker build --platform linux/amd64 \
            --build-arg VITE_API_URL="http://${{ secrets.EC2_HOST }}:8000" \
            -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml up -d
